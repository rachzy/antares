<div #skyDiv class="h-full w-full"></div>

@if (loadError()) {
<p
  class="absolute bottom-4 left-4 rounded-full border border-border bg-destructive/15 px-3 py-1.5 font-mono text-xs text-destructive backdrop-blur-sm"
>
  Unable to load the sky viewer.
</p>
} @else if (loading()) {
<p
  class="absolute bottom-4 left-4 rounded-full border border-border bg-card/80 px-3 py-1.5 font-mono text-xs text-muted-foreground backdrop-blur-sm"
>
  Loading the sky&hellip;
</p>
} @else if (selectedCoord(); as coord) {
<div
  class="absolute bottom-4 left-4 rounded-full border border-border bg-card/80 px-3 py-1.5 font-mono text-xs text-foreground backdrop-blur-sm"
>
  RA {{ coord.ra.toFixed(4) }}&deg;, Dec {{ coord.dec.toFixed(4) }}&deg;
</div>
}
