@if (star(); as s) {
  <section
    class="bg-card flex w-1/3 shrink-0 flex-col gap-2 rounded-xl p-4 shadow-sm"
  >
    <h2 class="font-serif text-2xl font-semibold">{{ s.display_name }}</h2>
    <p class="text-muted-foreground text-xs">
      {{ s.designation || s.catalog + ' ' + s.catalog_id }} &middot; RA
      {{ s.ra_deg.toFixed(2) }}&deg; &middot; Dec
      {{ s.dec_deg.toFixed(2) }}&deg;
    </p>
    <a
      [href]="catalogUrl()"
      target="_blank"
      rel="noopener noreferrer"
      class="text-foreground hover:text-primary text-sm underline"
      >View on Stellar Catalog</a
    >
    <div class="flex-1"></div>
    <button hlmBtn type="button" (click)="extract()">
      Extract lightcurve features
    </button>
  </section>
}
<div class="relative min-w-0 flex-1 overflow-hidden rounded-xl">
  <an-sky-viewer />
  <div
    class="bg-card/90 absolute bottom-4 left-1/2 flex -translate-x-1/2 flex-col items-center gap-1.5 rounded-xl p-3.5 shadow-sm backdrop-blur-sm"
  >
    <button hlmBtn type="button" [disabled]="!canConfirm()" (click)="confirm()">
      Confirm star
    </button>
    @if (tooWide()) {
      <p class="text-muted-foreground text-xs">
        Zoom in until a single star sits inside the ring.
      </p>
    }
  </div>
</div>
