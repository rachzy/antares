x-restart: &restart
  restart: unless-stopped

services:
  shaula:
    <<: *restart
  fang:
    <<: *restart
    volumes:
      - ${FANG_MODELS_DIR:-antares-fang-models}:/var/lib/fang/models
  api:
    <<: *restart
    environment:
      ANTARES_ALLOWED_ORIGINS: ${ANTARES_ALLOWED_ORIGINS:-http://localhost:${PROXY_PORT:-80}}
  www:
    <<: *restart
  proxy:
    <<: *restart
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - '${BIND:-127.0.0.1}:${PROXY_PORT:-80}:80'
      - '${BIND:-127.0.0.1}:${PROXY_TLS_PORT:-443}:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - antares-caddy-data:/data
    depends_on:
      - api
      - www

volumes:
  antares-caddy-data:
