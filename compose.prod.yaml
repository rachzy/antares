x-restart: &restart
  restart: unless-stopped

services:
  shaula:
    <<: *restart
  fang:
    <<: *restart
    volumes:
      - ${FANG_MODELS_DIR:-antares-fang-models}:/var/lib/fang/models
  api:
    <<: *restart
    environment:
      ANTARES_ALLOWED_ORIGINS: ${ANTARES_ALLOWED_ORIGINS:-http://localhost:${PROXY_PORT:-80}}
  www:
    <<: *restart
  proxy:
    <<: *restart
    image: nginx:alpine
    ports:
      - '${BIND:-127.0.0.1}:${PROXY_PORT:-80}:80'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - www
