name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump applied to the latest tag
        type: choice
        options: [patch, minor, major]
        default: patch
      tag:
        description: Exact tag to release (e.g. v1.2.0); overrides the bump
        type: string
        required: false
      deploy:
        description: Deploy to the VPS after releasing
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute the tag
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$MANUAL_TAG" ]; then
            tag="$MANUAL_TAG"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag must look like v1.2.3"; exit 1; }
          else
            latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
            major=${major#v}
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              *) patch=$((patch + 1)) ;;
            esac
            tag="v$major.$minor.$patch"
          fi
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::error::Tag $tag already exists"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Merge dev into main and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dev
          if git merge-base --is-ancestor origin/dev HEAD; then
            echo "::error::dev has nothing new compared to main"; exit 1
          fi
          git merge --no-ff origin/dev -m "Release $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin main "$TAG"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag

  deploy:
    needs: release
    if: inputs.deploy
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
    secrets: inherit
